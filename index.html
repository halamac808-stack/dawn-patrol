<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#071A20">
<title>Dawn Patrol — Europe 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Dawn Patrol">
<meta name="description" content="156 Atlantic surf spots with live swell, wind and tide, scored against The Stormrider Surf Guide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#071A20; --panel:#0E2A33; --panel2:#13363F; --line:#1E4A56;
  --paper:#E8E2D2; --mute:#7F9AA3; --buoy:#E86A33; --glass:#6FD3A8; --amber:#E3B23C;
  --disp:'Barlow Condensed',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:var(--body)}
body{padding-bottom:env(safe-area-inset-bottom);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--glass)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

header.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--ink) 72%,rgba(7,26,32,0));padding:14px 0 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--disp);font-weight:600;font-size:26px;letter-spacing:.10em;text-transform:uppercase;margin:0}
.brand span{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.16em;text-transform:uppercase}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--paper);
  border-radius:2px;padding:11px 12px;font-family:var(--mono);font-size:14px;outline:none}
.search input::placeholder{color:var(--mute)}
.search input:focus{border-color:var(--glass)}
.tabs{display:flex;gap:2px;margin-top:10px;border-bottom:1px solid var(--line)}
.tabs button{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:13px;
  padding:8px 12px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--paper);border-bottom-color:var(--buoy)}

.regionhead{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.regionhead .num{font-family:var(--mono);font-size:11px;color:var(--buoy);letter-spacing:.1em}
.regionhead h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.10em;font-size:16px;
  font-weight:500;margin:0;flex:1;color:var(--paper)}
.regionhead .rank{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;
  color:var(--glass);border:1px solid var(--line);padding:4px 9px;border-radius:2px}

.spot{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--panel);
  border:1px solid var(--line);border-left-width:3px;border-radius:2px;margin-bottom:5px;width:100%;text-align:left}
.spot:active{background:var(--panel2)}
.spot .nm{flex:1;min-width:0}
.spot .nm b{display:block;font-weight:500;font-size:15px;letter-spacing:.01em}
.spot .nm em{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--mute);
  margin-top:3px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:2px;white-space:nowrap}
.star{font-size:17px;color:var(--line);padding:2px 4px}
.star.on{color:var(--amber)}

.dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:middle}
.warn{color:var(--buoy)} .ok{color:var(--glass)} .mid{color:var(--amber)}

.detail{padding-bottom:40px}
.back{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--mute);padding:12px 0}
.dtitle{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:.03em;margin:2px 0 2px;line-height:1.05}
.dsub{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px;margin-top:12px}
.card h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.13em;font-size:12px;
  color:var(--mute);margin:0 0 10px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:12px}
.metric .k{font-family:var(--disp);text-transform:uppercase;font-size:10.5px;letter-spacing:.11em;color:var(--mute)}
.metric .v{font-family:var(--mono);font-size:19px;font-weight:500;margin-top:2px}
.metric .u{font-size:11px;color:var(--mute)}

.scorewrap{display:flex;align-items:center;gap:14px}
.bigscore{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.scorelabel{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:15px}
.bars{flex:1;display:grid;gap:5px}
.bar{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:8px}
.bar span{font-family:var(--disp);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.bar i{height:5px;background:var(--line);border-radius:2px;display:block;position:relative;overflow:hidden}
.bar i b{position:absolute;left:0;top:0;bottom:0;background:var(--glass);border-radius:2px}

svg.tide{width:100%;height:96px;display:block}
.tidelabels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:4px}

.win{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.win:last-child{border-bottom:none}
.win .t{font-family:var(--mono);font-size:13px;min-width:132px}
.win .s{font-family:var(--mono);font-size:13px;font-weight:600}
.win .w{font-family:var(--disp);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);flex:1;text-align:right}

.notes{font-size:14.5px;line-height:1.62;color:#D6D0C0}
.flagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.flag{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;
  padding:4px 8px;border-radius:2px;border:1px solid}
.f-pol{color:var(--buoy);border-color:#5A3020}
.f-haz{color:var(--amber);border-color:#5A4820}
.f-cro{color:var(--mute);border-color:var(--line)}
.f-exp{color:#FF8B6B;border-color:#5A3020}
.f-app{color:var(--mute);border-color:var(--line)}

.act{display:flex;gap:8px;margin-top:12px}
.act a,.act button{flex:1;text-align:center;font-family:var(--disp);text-transform:uppercase;
  letter-spacing:.12em;font-size:13px;padding:12px;border:1px solid var(--line);border-radius:2px;
  color:var(--paper);text-decoration:none;background:var(--panel)}
.act a:active{background:var(--panel2)}

.empty{color:var(--mute);font-family:var(--mono);font-size:12.5px;padding:26px 2px;line-height:1.7}
.load{color:var(--mute);font-family:var(--mono);font-size:12px;padding:8px 0}
.err{color:var(--buoy);font-family:var(--mono);font-size:12.5px;padding:8px 0;line-height:1.6}
.foot{color:var(--mute);font-family:var(--mono);font-size:10.5px;line-height:1.8;
  padding:26px 0 40px;border-top:1px solid var(--line);margin-top:28px}
@media(prefers-reduced-motion:no-preference){.spot,.card{transition:background .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Dawn Patrol</h1><span>Europe · Sep 2026</span></div>
  <div class="search"><input id="q" type="search" placeholder="Search 156 spots…" autocomplete="off"></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="route" aria-selected="true">Route</button>
    <button role="tab" data-tab="near" aria-selected="false">Near me</button>
    <button role="tab" data-tab="fav" aria-selected="false">Saved</button>
  </div>
</div></header>
<main class="wrap" id="app"></main>

<script>
const SPOTS = [{"n":"Les Mascarets - St-Pardon","r":"Gironde (FR)","rc":"01","la":44.91031,"lo":-0.31991,"a":0,"d":"Tidal bore on the Dordogne, not the coast. Longboard only, needs a high tide coefficient. 40min E of Bordeaux - opposite direction from everything else.","tide":"mid-high","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Le Verdon / La Chambrette","r":"Gironde (FR)","rc":"01","la":45.55174,"lo":-1.05959,"a":0,"d":"Ultimate shelter when the coast is onshore and out of control. Breaks hard, fast tubes, big high tides only. Estuary = gnarly rips and pollution.","tide":"mid-high","sw":"NW","off":90,"min":2.0,"max":6.0,"f":{"pollution":true,"crowd":false,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"Soulac","r":"Gironde (FR)","rc":"01","la":45.46167,"lo":-1.15276,"a":0,"d":"Rivermouth sandbanks. Always smaller than neighbours but hollower. Beware the rocks of 'les piscines' to the north and swirling currents.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"L'Amelie","r":"Gironde (FR)","rc":"01","la":45.48497,"lo":-1.15152,"a":0,"d":"Fast hollow waves by the blockhaus or the jetty. Undeveloped except a dune campsite. Fairly consistent, crowded in summer.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":true,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Le Gurp","r":"Gironde (FR)","rc":"01","la":45.43445,"lo":-1.15304,"a":0,"d":"Long tubing lefts on a large swell with luck. Check banks at La Negade north or Depee by the Euronat nudist camp. Can be crowded with attitude.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":true,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Montalivet","r":"Gironde (FR)","rc":"01","la":45.3778,"lo":-1.15965,"a":0,"d":"Peaks visible from the central car park, more if you look around. Surf club runs night sessions. South side is a naturist hub.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Le Pin Sec","r":"Gironde (FR)","rc":"01","la":45.27764,"lo":-1.16416,"a":0,"d":"One road bisects the 10km Foret du Flamand. Endless peaks, never crowded, good campsite. Beginner-friendly but there are rips.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":true,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"Hourtin","r":"Gironde (FR)","rc":"01","la":45.22346,"lo":-1.1721,"a":0,"d":"Open beachbreak that lines up on its day. Alios soft reef shapes bowly waves, but high tide kills it in small swell. Popular British hangout.","tide":"low-mid","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Le Crohot des Cavales","r":"Gironde (FR)","rc":"01","la":45.15,"lo":-1.183,"a":1,"d":"APPROX PIN. Large shadow zone west of Hourtin lake, bicycle access only. Not the hollowest banks but you surf it solo. UCPA Bombannes has the straightest access.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Carcans","r":"Gironde (FR)","rc":"01","la":45.08207,"lo":-1.19268,"a":0,"d":"Always quieter than Lacanau, waves no worse. More walled-up than hollow but plenty of power. Can get rippy.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"Lacanau","r":"Gironde (FR)","rc":"01","la":45.0056,"lo":-1.20082,"a":0,"d":"ANCHOR. Contest venue since 1979, surf central for Bordeaux. Check it from the Plage Centrale boardwalk then pick La Nord, La Sud or Super Sud across 14km. Medium W-NW.","tide":"any","sw":"NW","off":90,"min":0.7,"max":3.0,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Le Porge","r":"Gironde (FR)","rc":"01","la":44.8917,"lo":-1.21904,"a":0,"d":"Closest spot to Bordeaux - which means crowds in season. Several car parks lead to different peaks. Pretty strong currents.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"La Jenny","r":"Gironde (FR)","rc":"01","la":44.8408,"lo":-1.22729,"a":0,"d":"Consistent, often hollow peaks in small W swells. Access north of the nudist camp entrance; the long walk in means it is never crowded.","tide":"any","sw":"W","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":true,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Le Grand Crohot","r":"Gironde (FR)","rc":"01","la":44.7943,"lo":-1.22588,"a":0,"d":"Landes-like line-ups with plenty of baines and good shape in peaky summer swells. Closes out past 2m. Quieter toward Petit Crohot.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Le Truc Vert","r":"Gironde (FR)","rc":"01","la":44.71511,"lo":-1.24928,"a":0,"d":"Best-known Cap Ferret spot, jetty-influenced sandbanks. Summer crowds in front of the car park. Strong currents and drift.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"L'Horizon","r":"Gironde (FR)","rc":"01","la":44.645,"lo":-1.2545,"a":1,"d":"APPROX PIN. One of a dozen semi-secret spots on the peninsula, great banks on any given day. Better with peaky summer W windswells. Beach markers help gauge the swift currents.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"La Pointe","r":"Gironde (FR)","rc":"01","la":44.607,"lo":-1.247,"a":1,"d":"APPROX PIN. Very large swells wrap around Cap Ferret into the Bassin d'Arcachon - tubey little rights. W winds offshore, hellish currents. Great view of Dune du Pyla.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"La Salie","r":"Landes (FR)","rc":"02","la":44.52864,"lo":-1.25256,"a":0,"d":"Technically Gironde. Fast-shifting sandbars around two access points, most reliable beside the 800m wharf. The outfall pipe discharges suspicious foam - swimming theoretically banned.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Biscarrosse-Plage","r":"Landes (FR)","rc":"02","la":44.44498,"lo":-1.24662,"a":0,"d":"Popular resort, typical shifting bars - high tide shories to fast hollow outer low tide bars. Crowded at the access points. MILITARY ZONE restricts access south to Mimizan.","tide":"mid-high","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":true,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Mimizan-Plage","r":"Landes (FR)","rc":"02","la":44.21286,"lo":-1.29368,"a":0,"d":"Quiet with good waves. Four beaches either side of the rivermouth shape decent sandbars. Highly changeable. Estuary pollution and paper-mill smells on offshores.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":true,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Lespecier","r":"Landes (FR)","rc":"02","la":44.145,"lo":-1.306,"a":1,"d":"APPROX PIN. Small isolated resort, endless peaks in each direction. Unappealing in onshores or overhead. Plenty of current, few people outside August. One road in from Bias.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Contis-Plage","r":"Landes (FR)","rc":"02","la":44.09126,"lo":-1.32088,"a":0,"d":"Saint Julien en Born's mellow resort. The lighthouse gives a bird's eye view of the best banks, especially north near the bunker or rivermouth. Estuarine pollution.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":true,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Cap de L'Homy","r":"Landes (FR)","rc":"02","la":44.03827,"lo":-1.33876,"a":0,"d":"Straight beachbreak that benefits from swell angle or chopped-up summer windswells. Beginner/intermediate. Year-round peace and solitude. Summer surf school.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"St-Girons Plage","r":"Landes (FR)","rc":"02","la":43.9515,"lo":-1.36395,"a":0,"d":"12km of beachbreak - somewhere between Hossegor barrels and average walls. Favourite of foreign surfers and naturists, good dune camping, beginner schools.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Moliets Plage","r":"Landes (FR)","rc":"02","la":43.851,"lo":-1.39,"a":1,"d":"APPROX PIN. Central beach soaks up the summer crowd on very shifty banks that often shut down. High tide no good. The Huchet rivermouth from Leon lake shapes better low-tide bars.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Vieux Boucau","r":"Landes (FR)","rc":"02","la":43.78815,"lo":-1.41355,"a":0,"d":"The D652 runs close here so several peaks are easy to check. North side: fast hollow peaks on higher tides, heavy longshore rips at headhigh plus. HOLDS MORE SIZE than the breaks north.","tide":"mid-high","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"Labenne-Ocean","r":"Landes (FR)","rc":"02","la":43.59977,"lo":-1.47314,"a":0,"d":"Moderate NW and offshores give heavy peaks close to shore. More likely shorepound than true barrels. Crowds rising thanks to N10 proximity.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Tarnos Plage","r":"Landes (FR)","rc":"02","la":43.55959,"lo":-1.50059,"a":0,"d":"SKIP. The jetty shapes point-style lefts with hollow sections, but a sunken ship waits for missed take-offs, the Adour pours pollution out, and the industrial setting adds to an unfriendly vibe.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":true,"crowd":false,"hazard":false,"expert":false,"skip":true,"bailout":false}},{"n":"Le Penon","r":"Hossegor / Seignosse / Capbreton (FR)","rc":"03","la":43.70931,"lo":-1.43657,"a":0,"d":"Open and shifty, holds good higher-tide shorebreaks. Closes out before double overhead. More banks up at Casernes. CAR CRIME at the north end (L'Agreou). Strong rips.","tide":"any","sw":"NW","off":90,"min":0.6,"max":2.2,"f":{"pollution":false,"crowd":false,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"Les Bourdaines","r":"Hossegor / Seignosse / Capbreton (FR)","rc":"03","la":43.69443,"lo":-1.43984,"a":0,"d":"Good banks either side of the access path, defined channel between peaks, rippy inside. Popular with longboarders, very consistent, regular contest site. Parking is the constraint.","tide":"any","sw":"NW","off":90,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":false,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"Les Estagnots","r":"Hossegor / Seignosse / Capbreton (FR)","rc":"03","la":43.68675,"lo":-1.44072,"a":0,"d":"Top quality peaks on a good W-NW. Handles more size than Bourdaines and P "12","la":39.0035,"lo":-9.4235,"a":1,"d":"APPROX PIN. Breaking off the point directly opposite Coxos but much less consistent - a suitably named shallow left reef. Only works on SW swells at high tide, but when it does it's about the hollowest left around and full of hot bodyboarders.","tide":"mid-high","sw":"SW","off":75,"min":1.2,"max":3.0,"f":{"pollution":false,"crowd":false,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"Ribeira d'Ilhas","r":"Ericeira (PT)","rc":"12","la":38.98888,"lo":-9.41599,"a":0,"d":"THE WORKHORSE - the one you surf daily. Essentially two waves in one; Pontinha is the northern, less frequently ridden outside section. A very versatile set of reefs that normally has something worth getting wet for, and it can be a superb long right. Handles a bit of wind, most swell sizes if NW, and breaks throughout the tide. Consistent, crowded (contest site), some rips, URCHINS, and the water is none too clean. Easy access and good car park cafe.","tide":"any","sw":"NW","off":75,"min":0.8,"max":3.5,"f":{"pollution":false,"crowd":true,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"Reef","r":"Ericeira (PT)","rc":"12","la":38.976,"lo":-9.4185,"a":1,"d":"APPROX PIN. Swells come crashing out of deep water onto a submerged, URCHIN-INFESTED rock shelf and produce the hollowest wave in Ericeira. Fickle and very short, needs gentle offshores and perfectly clean 1-2m swell. When it's on, it's impossible to avoid getting tubed. Crowds.","tide":"any","sw":"NW","off":75,"min":1.0,"max":2.2,"f":{"pollution":false,"crowd":false,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"Backdoor","r":"Ericeira (PT)","rc":"12","la":38.974,"lo":-9.4195,"a":1,"d":"APPROX PIN. Normally a summer break, works best on N-NW swell. Holds some very hollow sections and is sketchy on low tide. Maxes out at double overhead. EXPERTS ONLY, and crowded when it works.","tide":"any","sw":"NW","off":75,"min":1.0,"max":2.4,"f":{"pollution":false,"c ar down the Costa Caparica the vibe becomes very mellow and Lisbon feels a long way away. Set in beautiful countryside with parques de campismo, this is one of several beach access spots that all provide quiet waves. A small rivermouth helps form better than average sandbars. NW swell and outgoing tide. Consistent and sometimes crowded in summer. CLEANISH WATER.","tide":"low-mid","sw":"NW","off":75,"min":0.8,"max":2.6,"f":{"pollution":false,"crowd":true,"hazard":false,"expert":false,"skip":false,"bailout":false}},{"n":"Bicas","r":"Lisbon (PT)","rc":"13","la":38.479,"lo":-9.1735,"a":1,"d":"APPROX PIN. A high quality left reefbreak that can hold a solid bit of W-NW swell. It breaks fast and hollow off cliffs at the far end of the Costa Caparica, but is a fickle little number and is rarely surfed. Rocks and rips to contend with.","tide":"any","sw":"NW","off":75,"min":1.5,"max":4.0,"f":{"pollution":false,"crowd":false,"hazard":true,"expert":false,"skip":false,"bailout":false}},{"n":"Sesimbra","r":"Lisbon (PT)","rc":"13","la":38.44141,"lo":-9.0951,"a":0,"d":"Not an area known for its surf, but the beautiful coastline around Sesimbra shelters a couple of very rarely breaking spots that require massive swells and N winds.","tide":"any","sw":"NW","off":75,"min":3.0,"max":8.0,"f":{"pollution":false,"crowd":false,"hazard":false,"expert":false,"skip":false,"bailout":false}}];
const DIRS={N:0,NNE:22,NE:45,ENE:67,E:90,ESE:112,SE:135,SSE:157,S:180,SSW:202,SW:225,WSW:247,W:270,WNW:292,NW:315,NNW:337};
const app=document.getElementById('app'), q=document.getElementById('q');
let tab='route', favs=new Set(), here=null, cache={};

/* ---------- storage ---------- */
function loadFavs(){
  try{const r=localStorage.getItem('dp.favs'); if(r) favs=new Set(JSON.parse(r));}catch(e){}
  return Promise.resolve();
}
function saveFavs(){
  try{localStorage.setItem('dp.favs',JSON.stringify([...favs]));}catch(e){}
  return Promise.resolve();
}
// keep the last good forecast per spot so a dead signal still shows something
function stash(k,v){try{localStorage.setItem('dp.fc.'+k,JSON.stringify({at:Date.now(),v}));}catch(e){}}
function unstash(k){try{const r=localStorage.getItem('dp.fc.'+k);return r?JSON.parse(r):null;}catch(e){return null;}}

/* ---------- helpers ---------- */
const compass=d=>['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(((d%360)/22.5))%16];
const angDiff=(a,b)=>{let d=Math.abs(a-b)%360;return d>180?360-d:d;};
const ft=m=>(m*3.28084);
function km(a,b,c,d){const R=6371,p=Math.PI/180;
  const x=(c-a)*p,y=(d-b)*p,h=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
const fmtH=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fmtD=t=>new Date(t).toLocaleDateString([], {weekday:'short'});

/* ---------- scoring ---------- */
function tidePhase(level,lo,hi){ if(hi-lo<0.05) return 0.5; return (level-lo)/(hi-lo); }
function tideScore(spot,ph){
  const t=spot.tide;
  if(t==='any') return 8;
  if(t==='low')      return ph<0.30?10:ph<0.50?6:ph<0.70?2:0;
  if(t==='low-mid')  return ph<0.55?10:ph<0.72?5:1;
  if(t==='mid')      return (ph>0.33&&ph<0.67)?10:(ph>0.2&&ph<0.8)?5:1;
  if(t==='mid-high') return ph>0.45?10:ph>0.30?5:1;
  return 8;
}
function score(spot,c){
  // size /40
  let size, h=c.sh;
  if(h<spot.min) size=Math.max(0,40*Math.pow(h/spot.min,1.6)*0.75);
  else if(h>spot.max) size=Math.max(0,40-46*((h-spot.max)/Math.max(spot.max,1)));
  else{const mid=(spot.min+spot.max)/2,half=Math.max((spot.max-spot.min)/2,0.2);
       size=40-11*Math.abs(h-mid)/half;}
  // period bonus folded into size
  if(c.pp&&c.pp>=11) size=Math.min(40,size+3); else if(c.pp&&c.pp<7) size=Math.max(0,size-4);
  // swell direction /25
  const want=DIRS[spot.sw]!==undefined?DIRS[spot.sw]:315;
  const sd=angDiff(c.sd,want);
  let dir = sd<=25?25 : sd<=50?25-(sd-25)*0.42 : sd<=90?14-(sd-50)*0.30 : Math.max(0,2-(sd-90)*0.03);
  // wind /25
  const wd=angDiff(c.wd,spot.off);
  let wind;
  if(c.ws<7) wind=23;                                  // glassy regardless
  else if(wd<=45) wind=25-Math.min(6,(c.ws-7)*0.10);   // offshore
  else if(wd<=90) wind=15-Math.min(9,(c.ws-7)*0.32);   // cross
  else wind=Math.max(0,11-(c.ws-7)*0.62);              // onshore
  wind=Math.max(0,wind);
  // tide /10
  const tide=tideScore(spot,c.ph);
  const total=Math.max(0,Math.min(100,size+dir+wind+tide));
  return {total:Math.round(total),size,dir,wind,tide};
}
const rateLabel=s=>s>=78?'Firing':s>=62?'Good':s>=45?'Fair':s>=28?'Marginal':'Flat / Blown';
const rateColor=s=>s>=62?'var(--glass)':s>=45?'var(--amber)':s>=28?'#C98A5E':'var(--buoy)';

/* ---------- data ---------- */
async function getCond(spot){
  const k=spot.n; if(cache[k]&&Date.now()-cache[k].at<25*60*1000) return cache[k].v;
  const m='https://marine-api.open-meteo.com/v1/marine?latitude='+spot.la+'&longitude='+spot.lo+
    '&hourly=swell_wave_height,swell_wave_direction,swell_wave_period,wave_height,sea_level_height_msl'+
    '&timezone=auto&forecast_days=3';
  const w='https://api.open-meteo.com/v1/forecast?latitude='+spot.la+'&longitude='+spot.lo+
    '&hourly=wind_speed_10m,wind_direction_10m&timezone=auto&forecast_days=3';
  let mr,wr;
  try{ [mr,wr]=await Promise.all([fetch(m),fetch(w)]); }
  catch(netErr){
    const old=unstash(k);
    if(old){ old.v.stale=old.at; cache[k]={at:Date.now(),v:old.v}; return old.v; }
    throw new Error('no connection');
  }
  if(!mr.ok||!wr.ok){
    const old=unstash(k);
    if(old){ old.v.stale=old.at; cache[k]={at:Date.now(),v:old.v}; return old.v; }
    throw new Error('forecast service returned '+(mr.ok?wr.status:mr.status));
  }
  const [mj,wj]=await Promise.all([mr.json(),wr.json()]);
  const H=mj.hourly||{}, W=wj.hourly||{};
  if(!H.time||!H.time.length) throw new Error('No marine data for this point');
  const sea=H.sea_level_height_msl||[];
  const rows=H.time.map((t,i)=>({
    t, sh:(H.swell_wave_height&&H.swell_wave_height[i]!=null)?H.swell_wave_height[i]:(H.wave_height?H.wave_height[i]:0)||0,
    sd:(H.swell_wave_direction&&H.swell_wave_direction[i]!=null)?H.swell_wave_direction[i]:315,
    pp:(H.swell_wave_period&&H.swell_wave_period[i]!=null)?H.swell_wave_period[i]:0,
    ws:(W.wind_speed_10m&&W.wind_speed_10m[i]!=null)?W.wind_speed_10m[i]:0,
    wd:(W.wind_direction_10m&&W.wind_direction_10m[i]!=null)?W.wind_direction_10m[i]:0,
    sea:sea[i]!=null?sea[i]:null
  }));
  const have=rows.filter(r=>r.sea!=null).map(r=>r.sea);
  const lo=have.length?Math.min(...have):0, hi=have.length?Math.max(...have):0;
  rows.forEach(r=>{r.ph=r.sea!=null?tidePhase(r.sea,lo,hi):0.5;});
  const v={rows,lo,hi,hasTide:have.length>0};
  cache[k]={at:Date.now(),v}; stash(k,v); return v;
}
const nowIdx=rows=>{const n=Date.now();let b=0,bd=1e15;
  rows.forEach((r,i)=>{const d=Math.abs(new Date(r.t).getTime()-n); if(d<bd){bd=d;b=i;}});return b;};

/* ---------- views ---------- */
function flagRow(s){
  const f=s.f,out=[];
  if(f.skip) out.push('<span class="flag f-pol">Guide says skip</span>');
  if(f.pollution) out.push('<span class="flag f-pol">Pollution</span>');
  if(f.expert) out.push('<span class="flag f-exp">Heavy / experts</span>');
  if(f.hazard) out.push('<span class="flag f-haz">Hazards</span>');
  if(f.crowd) out.push('<span class="flag f-cro">Crowded</span>');
  if(f.bailout) out.push('<span class="flag f-cro">Bailout option</span>');
  if(s.a) out.push('<span class="flag f-app">Approx pin</span>');
  return out.length?'<div class="flagrow">'+out.join('')+'</div>':'';
}
function spotRow(s,extra){
  const on=favs.has(s.n)?' on':'';
  const sub=extra!==undefined?extra:(s.tide==='any'?'Most tides':'Tide: '+s.tide)+' · '+s.sw+' swell';
  return '<button class="spot" data-spot="'+encodeURIComponent(s.n)+'" style="border-left-color:'+
    (s.f.skip?'var(--buoy)':s.f.expert?'#8A4526':'var(--line)')+'">'+
    '<span class="nm"><b>'+s.n+'</b><em>'+sub+'</em></span>'+
    '<span class="star'+on+'" data-fav="'+encodeURIComponent(s.n)+'">★</span></button>';
}
function renderList(){
  const term=q.value.trim().toLowerCase();
  let list=SPOTS;
  if(tab==='fav') list=SPOTS.filter(s=>favs.has(s.n));
  if(term) list=list.filter(s=>s.n.toLowerCase().includes(term)||s.r.toLowerCase().includes(term));

  if(tab==='near'){
    if(!here){app.innerHTML='<div class="empty">Location not shared yet.<br><br>'+
      '<button id="geo" style="border:1px solid var(--line);padding:11px 15px;border-radius:2px;'+
      'font-family:var(--disp);letter-spacing:.12em;text-transform:uppercase">Use my location</button></div>';
      const g=document.getElementById('geo'); if(g) g.onclick=askGeo; return;}
    const near=list.map(s=>({s,d:km(here.lat,here.lon,s.la,s.lo)})).sort((a,b)=>a.d-b.d).slice(0,25);
    app.innerHTML='<div class="regionhead"><span class="num">◎</span><h2>Closest 25</h2></div>'+
      near.map(o=>spotRow(o.s,o.d<1?Math.round(o.d*1000)+' m away':o.d.toFixed(1)+' km · '+o.s.r)).join('')+foot();
    wire(); return;
  }
  if(!list.length){app.innerHTML='<div class="empty">'+(tab==='fav'
      ?'No saved spots yet. Tap the star on any spot to keep it here.'
      :'Nothing matches “'+q.value+'”.')+'</div>'; return;}

  const byR={};
  list.forEach(s=>{(byR[s.rc]=byR[s.rc]||{label:s.r,items:[]}).items.push(s);});
  let html='';
  Object.keys(byR).sort().forEach(rc=>{
    const g=byR[rc];
    html+='<div class="regionhead"><span class="num">'+rc+'</span><h2>'+g.label+'</h2>'+
      '<button class="rank" data-rank="'+rc+'">Rank now</button></div>'+
      '<div id="r'+rc+'">'+g.items.map(s=>spotRow(s)).join('')+'</div>';
  });
  app.innerHTML=html+foot(); wire();
}
function foot(){
  return '<div class="foot">Spot notes paraphrased from The Stormrider Surf Guide Europe.<br>'+
    'Conditions from Open-Meteo (marine + wind). Tide shown is modelled sea level, not a harbour tide table — '+
    'check a local table before committing to a tide-critical spot.<br>'+
    'Ratings are derived from the guide’s stated tide window, swell direction and offshore wind, and are a '+
    'starting point, not a substitute for looking at the water.</div>';
}
function wire(){
  app.querySelectorAll('[data-spot]').forEach(b=>b.addEventListener('click',e=>{
    if(e.target.dataset.fav!==undefined) return;
    openSpot(decodeURIComponent(b.dataset.spot));}));
  app.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation(); const n=decodeURIComponent(b.dataset.fav);
    favs.has(n)?favs.delete(n):favs.add(n); b.classList.toggle('on'); await saveFavs();}));
  app.querySelectorAll('[data-rank]').forEach(b=>b.addEventListener('click',()=>rankRegion(b.dataset.rank,b)));
}
function askGeo(){
  if(!navigator.geolocation){app.innerHTML='<div class="err">This browser can’t share a location.</div>';return;}
  app.innerHTML='<div class="load">Getting your position…</div>';
  navigator.geolocation.getCurrentPosition(
    p=>{here={lat:p.coords.latitude,lon:p.coords.longitude};renderList();},
    ()=>{app.innerHTML='<div class="err">Location unavailable. Allow location for this page, or use Route and Saved instead.</div>';},
    {timeout:10000,maximumAge:300000});
}
async function rankRegion(rc,btn){
  const items=SPOTS.filter(s=>s.rc===rc), box=document.getElementById('r'+rc);
  btn.textContent='Ranking…';
  const out=[];
  for(const s of items){
    try{const c=await getCond(s); const i=nowIdx(c.rows); const r=c.rows[i];
        out.push({s,v:score(s,r).total});}
    catch(e){out.push({s,v:-1});}
  }
  out.sort((a,b)=>b.v-a.v);
  box.innerHTML=out.map(o=>spotRow(o.s, o.v<0?'Forecast unavailable'
    :o.v+'/100 · '+rateLabel(o.v)+' · '+(o.s.tide==='any'?'most tides':o.s.tide))).join('');
  btn.textContent='Ranked'; wire();
}

/* ---------- detail ---------- */
async function openSpot(name){
  const s=SPOTS.find(x=>x.n===name); if(!s) return;
  window.scrollTo(0,0);
  app.innerHTML='<div class="detail"><button class="back" id="bk">← Back</button>'+
    '<div class="dtitle">'+s.n+'</div>'+
    '<div class="dsub">'+s.r+' · '+s.la.toFixed(4)+', '+s.lo.toFixed(4)+'</div>'+
    flagRow(s)+
    '<div class="card"><h3>Conditions</h3><div id="cond" class="load">Fetching swell, wind and tide…</div></div>'+
    '<div class="card"><h3>Next 48 hours</h3><div id="win" class="load">…</div></div>'+
    '<div class="card"><h3>From the guide</h3><div class="notes">'+s.d+'</div>'+
      '<div class="act">'+
      '<a href="https://www.google.com/maps/search/?api=1&query='+s.la+','+s.lo+'" target="_blank" rel="noopener">Open in Maps</a>'+
      '<a href="https://www.google.com/maps/dir/?api=1&destination='+s.la+','+s.lo+'" target="_blank" rel="noopener">Directions</a>'+
      '</div></div></div>';
  document.getElementById('bk').onclick=renderList;

  let c;
  try{ c=await getCond(s); }
  catch(e){
    document.getElementById('cond').outerHTML='<div class="err">No forecast yet — '+e.message+
      '.<br>The guide notes below work offline. Reopen this spot once you have signal and it will save '+
      'a copy for next time.</div>';
    document.getElementById('win').outerHTML='<div class="err">No forecast to rank.</div>'; return;
  }
  const i=nowIdx(c.rows), r=c.rows[i], sc=score(s,r);
  if(c.stale){
    const age=Math.round((Date.now()-c.stale)/3600000);
    const b=document.createElement('div'); b.className='err';
    b.style.cssText='background:#2A1A10;border:1px solid #5A3020;padding:9px 11px;border-radius:2px;margin-top:10px';
    b.textContent='Offline — showing the forecast saved '+(age<1?'less than an hour':age+' hour'+(age>1?'s':''))+' ago.';
    document.querySelector('.dsub').after(b);
  }
  const bar=(lab,val,max)=>'<div class="bar"><span>'+lab+'</span><i><b style="width:'+
    Math.round(100*Math.max(0,val)/max)+'%;background:'+rateColor(100*val/max)+'"></b></i></div>';
  document.getElementById('cond').outerHTML=
    '<div class="scorewrap"><div><div class="bigscore" style="color:'+rateColor(sc.total)+'">'+sc.total+
      '</div><div class="scorelabel" style="color:'+rateColor(sc.total)+'">'+rateLabel(sc.total)+'</div></div>'+
    '<div class="bars">'+bar('Size',sc.size,40)+bar('Swell dir',sc.dir,25)+bar('Wind',sc.wind,25)+bar('Tide',sc.tide,10)+'</div></div>'+
    '<div class="grid" style="margin-top:16px">'+
      met('Swell',ft(r.sh).toFixed(1),'ft')+
      met('Period',r.pp?r.pp.toFixed(0):'–','s')+
      met('From',compass(r.sd),Math.round(r.sd)+'°')+
      met('Wind',Math.round(r.ws),'km/h '+compass(r.wd))+
      met('Tide',c.hasTide?(r.ph<0.33?'Low':r.ph<0.67?'Mid':'High'):'n/a',
          c.hasTide?(Math.round(r.ph*100)+'%'):'')+
      met('Wants',s.tide==='any'?'Most':s.tide,s.sw+' swell')+
    '</div>'+ (c.hasTide?tideSvg(c,i,s):'');
  const wins=bestWindows(s,c);
  document.getElementById('win').outerHTML= wins.length
    ? wins.map(w=>'<div class="win"><span class="t">'+fmtD(w.a)+' '+fmtH(w.a)+'–'+fmtH(w.b)+
        '</span><span class="s" style="color:'+rateColor(w.v)+'">'+w.v+'</span>'+
        '<span class="w">'+w.note+'</span></div>').join('')
    : '<div class="empty" style="padding:6px 0">Nothing above marginal in the next 48 hours. '+
      'Try the Rank now button on this region to find a better option.</div>';
}
const met=(k,v,u)=>'<div class="metric"><div class="k">'+k+'</div><div class="v">'+v+
  ' <span class="u">'+(u||'')+'</span></div></div>';

function bestWindows(s,c){
  const out=[],n=Math.min(c.rows.length,49);
  let run=null;
  for(let i=0;i<n;i++){
    const v=score(s,c.rows[i]).total;
    if(v>=45){ if(!run) run={a:c.rows[i].t,b:c.rows[i].t,v:v,best:c.rows[i]};
               else {run.b=c.rows[i].t; if(v>run.v){run.v=v;run.best=c.rows[i];}} }
    else if(run){ out.push(run); run=null; }
  }
  if(run) out.push(run);
  return out.sort((a,b)=>b.v-a.v).slice(0,4).map(w=>({
    a:w.a,b:w.b,v:w.v,
    note:ft(w.best.sh).toFixed(1)+'ft '+compass(w.best.sd)+' · '+Math.round(w.best.ws)+'km/h '+compass(w.best.wd)
  })).sort((a,b)=>new Date(a.a)-new Date(b.a));
}

/* signature: tide curve with the spot's preferred window shaded */
function tideSvg(c,i,s){
  const W=340,H=90,pad=6, rows=c.rows.slice(Math.max(0,i-2),Math.max(0,i-2)+26);
  if(rows.length<4||!c.hasTide) return '';
  const xs=(k)=>pad+k*(W-2*pad)/(rows.length-1);
  const ys=(ph)=>H-pad-ph*(H-2*pad);
  let d='';rows.forEach((r,k)=>{d+=(k?'L':'M')+xs(k).toFixed(1)+' '+ys(r.ph).toFixed(1)+' ';});
  // preferred band
  let b0=0,b1=1;
  if(s.tide==='low'){b0=0;b1=0.30}else if(s.tide==='low-mid'){b0=0;b1=0.55}
  else if(s.tide==='mid'){b0=0.33;b1=0.67}else if(s.tide==='mid-high'){b0=0.45;b1=1}
  const band=(s.tide==='any')?'':
    '<rect x="0" y="'+ys(b1).toFixed(1)+'" width="'+W+'" height="'+Math.abs(ys(b0)-ys(b1)).toFixed(1)+
    '" fill="#6FD3A8" opacity="0.11"/>';
  const nowX=xs(rows.findIndex(r=>r.t===c.rows[i].t)<0?0:rows.findIndex(r=>r.t===c.rows[i].t));
  return '<div style="margin-top:16px"><svg class="tide" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" '+
    'role="img" aria-label="Tide over the next 24 hours">'+band+
    '<path d="'+d+'" fill="none" stroke="#7F9AA3" stroke-width="1.6"/>'+
    '<line x1="'+nowX.toFixed(1)+'" y1="0" x2="'+nowX.toFixed(1)+'" y2="'+H+'" stroke="#E86A33" stroke-width="1.4"/>'+
    '</svg><div class="tidelabels"><span>'+fmtH(rows[0].t)+'</span>'+
    '<span>'+(s.tide==='any'?'works most tides':'shaded = wants '+s.tide)+'</span>'+
    '<span>'+fmtH(rows[rows.length-1].t)+'</span></div></div>';
}

/* ---------- boot ---------- */
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));
  if(tab==='near'&&!here) askGeo(); else renderList();
});
q.addEventListener('input',()=>{if(tab==='fav'||tab==='near'){} renderList();});
loadFavs().then(renderList);
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
